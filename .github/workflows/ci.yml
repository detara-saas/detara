name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restaurar ferramentas
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore Detara.sln
      - name: Build Release
        run: dotnet build Detara.sln --configuration Release --no-restore
      - name: Testes
        run: dotnet test Detara.sln --configuration Release --no-build --logger trx
      - name: Formatação
        run: dotnet format Detara.sln --verify-no-changes --no-restore
      - name: Modelo EF sem alterações pendentes
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=detara_model_check;User Id=model_check;Password=model_check_only;Encrypt=True;TrustServerCertificate=True"
          Jwt__Emissor: Detara.CI
          Jwt__Audiencia: Detara.CI.Web
          Jwt__ChaveAssinatura: ci-only-tenant-signing-key-with-more-than-32-bytes
          PlatformJwt__Emissor: Detara.CI.Platform
          PlatformJwt__Audiencia: detara-ci-platform
          PlatformJwt__ChaveAssinatura: ci-only-platform-signing-key-different-more-than-32-bytes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Detara.Infrastructure/Detara.Infrastructure.csproj
          --startup-project src/Detara.Api/Detara.Api.csproj
          --configuration Release
          --no-build
      - name: Dependências vulneráveis conhecidas
        shell: bash
        run: |
          dotnet list Detara.sln package --vulnerable --include-transitive --format json > vulnerable-packages.json
          cat vulnerable-packages.json
          if jq -e '.. | objects | select(.vulnerabilities? and (.vulnerabilities | length > 0))' vulnerable-packages.json >/dev/null; then
            exit 1
          fi

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxe e shellcheck dos scripts operacionais
        run: |
          find scripts/production -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n scripts/production/automation/detara-stage-release
          bash -n scripts/production/automation/detara-deploy-release
          docker build -f scripts/production/tests/Dockerfile.qa -t detara-production-tools:ci .
          docker run --rm --network none -v "$PWD:/repo:ro" detara-production-tools:ci shellcheck \
            scripts/production/automation/lib.sh \
            scripts/production/automation/verify-release-images.sh \
            scripts/production/automation/bootstrap-deploy-user.sh \
            scripts/production/automation/detara-stage-release \
            scripts/production/automation/detara-deploy-release \
            scripts/production/automation/tests/*.sh
      - name: Validar Compose Production
        shell: bash
        run: bash scripts/production/tests/compose-fixture.sh
      - name: Guards de scripts e backup cifrado (providers simulados)
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" detara-production-tools:ci bash scripts/production/tests/safety-fixture.sh
          docker run --rm --network none -v "$PWD:/repo:ro" detara-production-tools:ci bash scripts/production/automation/tests/safety-fixture.sh
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" \
            detara-production-tools:ci \
            bash scripts/production/automation/tests/wrapper-fixture.sh
      - name: Validar Caddyfile
        run: >-
          docker run --rm
          -e DETARA_APP_HOST=app.detara.example.com
          -e DETARA_API_HOST=api.detara.example.com
          -e DETARA_ACME_EMAIL=ops@example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Construir imagem API
        run: docker build --file src/Detara.Api/Dockerfile --tag detara-api:ci .
      - name: Construir imagem Web
        run: docker build --file src/Detara.Web/Dockerfile --tag detara-web:ci .
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Gateway testes e vulnerabilidades
        working-directory: whatsapp-gateway
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts && npm test && npm audit --omit=dev
      - name: Construir gateway e migration bundle
        run: |
          docker build --file whatsapp-gateway/Dockerfile --tag detara-whatsapp-gateway:ci .
          docker build --file deploy/Dockerfile.migrations --tag detara-migrations:ci .
      - name: Cleanup real Chromium sem rede externa
        run: >-
          docker run --rm --init --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=512m
          -v "$PWD/whatsapp-gateway/qa:/app/qa:ro"
          detara-whatsapp-gateway:ci
          node --unhandled-rejections=strict --test --test-concurrency=1
          qa/chromium-cleanup.mjs qa/post-auth-mechanics.mjs qa/post-auth-adapter.mjs
