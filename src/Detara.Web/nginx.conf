server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(?:css|js|wasm|woff2|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
