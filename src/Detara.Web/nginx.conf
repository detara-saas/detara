server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:5090; worker-src 'self' blob:; frame-src 'self'" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires -1;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /service-worker-assets.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(?:css|js|wasm|woff2|png|ico)$ {
        expires 1h;
        try_files $uri =404;
    }
}
