<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Detara</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="Detara.Web.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <meta name="theme-color" content="#0B1220" />
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/detara-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/detara-app-icon-180.png" />
    <link rel="manifest" href="manifest.json" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" role="alert" aria-live="assertive">
        <div class="blazor-error-card">
            <span class="blazor-error-mark" aria-hidden="true">!</span>
            <div class="blazor-error-copy">
                <strong>Não foi possível continuar</strong>
                <span>A aplicação encontrou uma falha inesperada. Recarregue somente quando puder repetir a última ação com segurança.</span>
            </div>
            <div class="blazor-error-actions">
                <a href="." class="reload">Recarregar agora</a>
                <button type="button" class="dismiss" aria-label="Fechar aviso">Agora não</button>
            </div>
        </div>
    </div>
    <script src="js/detara.js"></script>
    <script src="js/pwa.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
