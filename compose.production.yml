x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  reverse-proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    # A imagem oficial possui file capability no binário; bounding set vazio impede exec.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      DETARA_APP_HOST: ${DETARA_APP_HOST:?Informe o host Web}
      DETARA_API_HOST: ${DETARA_API_HOST:?Informe o host API}
      DETARA_ACME_EMAIL: ${DETARA_ACME_EMAIL:?Informe o e-mail ACME}
      DETARA_TRUSTED_CIDRS: ${DETARA_TRUSTED_CIDRS:-127.0.0.254/32}
      DETARA_HSTS_MAX_AGE: ${DETARA_HSTS_MAX_AGE:-0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - detara-caddy-data:/data
      - detara-caddy-config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      edge:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  web:
    image: ${DETARA_WEB_IMAGE:?Informe a imagem Web imutável}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "8080"
    networks:
      edge:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  api:
    image: ${DETARA_API_IMAGE:?Informe a imagem API imutável}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 1.50
    mem_limit: 1536m
    pids_limit: 300
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${DETARA_API_HOST}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=Detara;User Id=detara_runtime;Password=${DETARA_SQL_RUNTIME_PASSWORD:?Informe a senha SQL runtime};Encrypt=True;TrustServerCertificate=True
      Jwt__ChaveAssinatura: ${DETARA_JWT_KEY:?Informe a chave JWT tenant}
      PlatformJwt__ChaveAssinatura: ${DETARA_PLATFORM_JWT_KEY:?Informe a chave JWT Platform}
      Web__PublicBaseUrl: https://${DETARA_APP_HOST}
      Cors__OrigensPermitidas__0: https://${DETARA_APP_HOST}
      Security__HstsEnabled: "false" # Caddy controla HSTS após validação de HTTPS.
      DataProtection__ApplicationName: Detara.Platform
      DataProtection__KeyRingPath: /var/lib/detara/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/detara-data-protection.pfx
      DataProtection__CertificatePassword: ${DETARA_DATA_PROTECTION_PASSWORD:?Informe a senha do certificado}
      ForwardedHeaders__ForwardLimit: 1
      ForwardedHeaders__KnownProxies__0: 172.30.0.2
      Storage__Provider: S3
      Storage__S3__ServiceUrl: ${DETARA_S3_ENDPOINT:?Informe o endpoint S3 HTTPS}
      Storage__S3__Bucket: ${DETARA_S3_BUCKET:?Informe o bucket privado}
      Storage__S3__Region: ${DETARA_S3_REGION:?Informe a região S3}
      Storage__S3__AccessKey: ${DETARA_S3_ACCESS_KEY:?Informe a credencial S3}
      Storage__S3__SecretKey: ${DETARA_S3_SECRET_KEY:?Informe o segredo S3}
      Storage__S3__ForcePathStyle: ${DETARA_S3_FORCE_PATH_STYLE:-true}
      Email__Provider: Resend
      Email__ApiKey: ${DETARA_RESEND_API_KEY:?Informe a API key Resend}
      Email__FromAddress: ${DETARA_EMAIL_FROM_ADDRESS:?Informe um remetente verificado}
      Email__FromName: ${DETARA_EMAIL_FROM_NAME:-Detara}
      WhatsAppGateway__Enabled: "true"
      WhatsAppGateway__BaseUrl: http://whatsapp-gateway:3000/
      WhatsAppGateway__ApiKey: ${DETARA_WHATSAPP_GATEWAY_API_KEY:?Informe a chave interna do gateway WhatsApp}
    volumes:
      - detara-data-protection-keys:/var/lib/detara/data-protection-keys
    secrets:
      - source: detara-data-protection
        target: detara-data-protection.pfx
    networks:
      edge:
        ipv4_address: 172.30.0.3
      data:
      integration:
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --header 'Host: ${DETARA_API_HOST}' http://localhost:8080/health/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  whatsapp-gateway:
    image: ${DETARA_WHATSAPP_GATEWAY_IMAGE:?Informe a imagem imutável do gateway WhatsApp}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 1.00
    mem_limit: 1536m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    environment:
      DETARA_WHATSAPP_GATEWAY_API_KEY: ${DETARA_WHATSAPP_GATEWAY_API_KEY:?Informe a chave interna do gateway WhatsApp}
      DETARA_WHATSAPP_SESSIONS_PATH: /app/sessions
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ${DETARA_WHATSAPP_PATH:-/var/lib/detara/whatsapp}:/app/sessions
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    networks:
      - integration
      - whatsapp-egress
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz',{headers:{Authorization:'Bearer '+process.env.DETARA_WHATSAPP_GATEWAY_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 1.50
    mem_limit: 2560m
    pids_limit: 512
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DETARA_SQL_ADMIN_PASSWORD:?Informe a senha administrativa SQL}
      MSSQL_MEMORY_LIMIT_MB: 2048
    expose:
      - "1433"
    volumes:
      - detara-sql-data:/var/opt/mssql
      - ${DETARA_BACKUP_PATH:-/var/backups/detara/sql}:/var/opt/mssql/backups
      - ./scripts/production:/opt/detara/scripts:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
  integration:
    internal: true
  whatsapp-egress:
    driver: bridge

volumes:
  detara-sql-data:
  detara-data-protection-keys:
  detara-caddy-data:
  detara-caddy-config:

secrets:
  detara-data-protection:
    file: ${DETARA_DATA_PROTECTION_CERTIFICATE:-/etc/detara/data-protection.pfx}
